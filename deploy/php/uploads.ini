; PHP limits for Pingly's FPM containers.
;
; ⚠️ The official `php:8.3-fpm` image ships NO php.ini at all — only the
; `php.ini-production` / `php.ini-development` templates, which nothing copies
; into place. `php --ini` therefore reports "Loaded Configuration File: (none)"
; and every value below was PHP's compiled-in default until this file existed.
;
; That is not cosmetic. The defaults are upload_max_filesize=2M and
; post_max_size=8M, while the application advertises far more: 64 MB in the
; gallery, 50 MB on the widget, 25 MB per e-mail attachment, 16 MB for WhatsApp
; template media, 10 MB on POST /api/uploads (flow attachments, carousel cards,
; campaign media), 5 MB for an agent avatar. Anything over 2 MB was refused by
; PHP before Laravel ever saw the bytes, so the customer read Laravel's
; `validation.uploaded` message — "The file failed to upload." — which names
; neither a size nor a limit, and the refusal never reached the application log
; because a 422 is not an exception. It looked random because it depended only
; on how big the file happened to be.
;
; ⚠️ Keep `upload_max_filesize` at or above the largest per-file limit any
; controller validates (today: gallery, GALLERY_MAX_UPLOAD_MB, default 64).
; Raising a controller's `max:` without raising this one re-creates the same
; silent failure.

; Largest single file. Matches the gallery, which is the highest per-file
; ceiling in the codebase.
upload_max_filesize = 64M

; Whole request body, so it must exceed upload_max_filesize with room for the
; other form fields. ⚠️ This is also the real cap on a multi-attachment e-mail:
; composeEmail() validates `attachments` as up to 20 files of 25 MB each, which
; is 500 MB on paper and deliverable by no mail server — the honest ceiling is
; this line, and anything past it returns 413, not a confusing 422.
post_max_size = 80M

; `attachments` alone allows 20 files; PHP's default is exactly 20, leaving no
; headroom for the other parts of the same request.
max_file_uploads = 30

; Uploads themselves stream to disk and do not need this, but GD does: avatars
; and contact photos are resized in-process, and a high-megapixel JPEG decodes
; to far more than 128M of raw bitmap.
memory_limit = 256M

; ── Error output ────────────────────────────────────────────────────────────
;
; ⚠️ Same root cause, found while verifying the limits above: with no php.ini,
; `display_errors` is On and `log_errors` is Off — the exact inverse of what
; `php.ini-production` sets, and nothing ever copied that template into place.
;
; This is not only a disclosure problem (APP_DEBUG=false keeps Laravel's stack
; traces out, but a PHP-level warning is printed underneath it, filesystem
; paths and all). It corrupts responses: PHP writes the warning into the body
; *before* Laravel can send a status, so the reply is a broken JSON document
; under a wrong status code. Proven in production — a 90 MB upload returned
; `200 text/html` carrying "POST Content-Length ... exceeds the limit" followed
; by Laravel's 413 body, instead of a clean 413. Any SPA parsing that response
; sees malformed JSON and reports something unrelated to what went wrong.
;
; And with log_errors Off, none of it was written anywhere at all.
display_errors = Off
display_startup_errors = Off

; To the FPM error log, i.e. `docker compose logs app`. Deliberately NOT a file
; inside the container: storage/logs is not a volume, so a path here would be
; erased by the next deploy — the same reason application logs already vanish.
log_errors = On

; Drops the `X-Powered-By: PHP/8.3.33` header, which names the exact patch
; level to anyone reading a response.
expose_php = Off
